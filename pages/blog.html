---
layout: page
title: Blog
permalink: /blog/
---
{% if site.posts.size == 0 %}
<p>No posts yet.</p>
{% else %}
<ul class="posts">
  {% for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%-d %b %Y" }}</time>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% endif %}
