---
layout: default
---
<article class="wrap page post">
  <p class="post__date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <h1 class="page__title">{{ page.title }}</h1>
  <div class="prose">
    {{ content }}
  </div>
  <p class="post__back"><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
</article>
