title: YuX Ren
email: your.email@example.com
url: https://yux-ren.github.io
baseurl: ""

# Use the default GitHub Pages theme for stability; easy to extend
theme: minima

# Plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Language & timezone
lang: zh-CN
timezone: Asia/Shanghai

# Navigation: which pages appear in the header
header_pages:
  - pages/blog.md
  - pages/projects.md
  - pages/publications.md
  - pages/cv.md

# Blog settings
show_excerpts: true

# Social (fill in as needed)
author: YuX Ren
minima:
  social_links:
    github: YuX-Ren
    linkedin: your-linkedin-username
  skin: auto

include:
  - _includes/head-custom.html

# Collections (extend later if needed)
collections:
  posts:
    output: true

# Sass (optional customization later)
sass:
  sass_dir: _sass
  style: compressed 